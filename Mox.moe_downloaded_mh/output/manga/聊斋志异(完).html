        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderMangaInfo();
            renderChapters();
        });
        
        // 渲染漫画信息
        function renderMangaInfo() {
            document.title = `${MANGA_INFO.display_name} - 漫画管理器`;
            document.getElementById('mangaTitle').textContent = MANGA_INFO.display_name;
            
            const infoContainer = document.getElementById('mangaInfo');
            
            // 状态
            let statusClass = 'status-ongoing';
            if (MANGA_INFO.status === '完结') {
                statusClass = 'status-completed';
            } else if (MANGA_INFO.status === '停更') {
                statusClass = 'status-stopped';
            }
            
            // 构建信息HTML
            let infoHTML = `
                <div class="info-item">
                    <span class="info-label">状态：</span>
                    <span class="status-badge ${statusClass}">${MANGA_INFO.status}</span>
                </div>
            `;
            
            // 彩色
            if (MANGA_INFO.colored) {
                infoHTML += `
                    <div class="info-item">
                        <span class="colored-badge">彩色</span>
                    </div>
                `;
            }
            
            // 章节数
            infoHTML += `
                <div class="info-item">
                    <span class="info-label">章节数：</span>
                    <span class="info-value">${MANGA_INFO.chapter_count}</span>
                </div>
            `;
            
            // 总大小
            if (MANGA_INFO.total_size) {
                infoHTML += `
                    <div class="info-item">
                        <span class="info-label">总大小：</span>
                        <span class="info-value">${MANGA_INFO.total_size}</span>
                    </div>
                `;
            }
            
            infoContainer.innerHTML = infoHTML;
        }
        
        // 渲染章节列表
        function renderChapters() {
            const tbody = document.getElementById('chapterTableBody');
            const noChapters = document.getElementById('noChapters');
            
            if (CHAPTERS.length === 0) {
                tbody.innerHTML = '';
                noChapters.style.display = 'block';
                return;
            }
            
            noChapters.style.display = 'none';
            
            tbody.innerHTML = CHAPTERS.map((chapter, index) => {
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="chapter-name">${chapter.name}</td>
                        <td class="file-size">${chapter.size}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
